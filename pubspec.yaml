name: phantom
description: Phantom - lecteur de musique perso (iPhone + Windows).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: any
  just_audio_background: any
  just_audio_media_kit: any
  media_kit_libs_windows_audio: any
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  file_picker: any
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: false
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
